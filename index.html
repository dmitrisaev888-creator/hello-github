<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Исаев Дмитрий</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-1: #0f0c29;
      --bg-2: #302b63;
      --bg-3: #24243e;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f5f5f7;
      --text-muted: rgba(245, 245, 247, 0.72);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.14);
      --accent: #7c6cff;
      --shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 108, 255, 0.18), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(88, 166, 255, 0.12), transparent 45%);
      pointer-events: none;
    }
    .page {
      position: relative;
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 24px 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
    }
    .avatar-wrap {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent), #58a6ff);
      box-shadow: 0 8px 32px rgba(124, 108, 255, 0.35);
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--bg-1);
    }
    .name {
      font-size: clamp(1.5rem, 5vw, 1.875rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .bio {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
      cursor: pointer;
    }
    .link-btn:hover {
      background: var(--btn-hover);
      border-color: rgba(124, 108, 255, 0.35);
      transform: translateY(-1px);
    }
    .link-btn:active {
      transform: translateY(0);
    }
    .link-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(20, 20, 30, 0.92);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.875rem;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    @media (max-width: 380px) {
      .card {
        padding: 32px 18px 24px;
        border-radius: 22px;
      }
      .avatar-wrap {
        width: 100px;
        height: 100px;
      }
      .link-btn {
        padding: 13px 16px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <div class="avatar-wrap">
        <img class="avatar" src="avatar1.png" alt="Исаев Дмитрий" width="120" height="120">
      </div>
      <h1 class="name">Исаев Дмитрий</h1>
      <p class="bio">
        Веб‑разработчик и инженер автоматизации.<br>
        Помогаю бизнесу внедрять ИИ‑агентов и оптимизировать процессы
      </p>
      <nav class="links" aria-label="Контакты">
        <a class="link-btn" href="https://t.me/IIIdalll" target="_blank" rel="noopener noreferrer">

          </svg>
          Telegram
        </a>
        <a class="link-btn" href="https://instagram.com/your_username" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
          </svg>
          Instagram
        </a>
        <a class="link-btn" href="https://www.youtube.com/@iiidalll" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          YouTube
        </a>
        <button class="link-btn" type="button" id="max-btn" data-phone="+79081606836">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM7 9h10v2H7V9zm6 4H7v-2h6v2zm4-6H7V5h10v2z"/>
          </svg>
          MAX
        </button>
        <button class="link-btn" type="button" id="email-btn" data-email="dmitrisaev@yandex.ru">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          Email
        </button>
      </nav>
    </article>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const emailBtn = document.getElementById('email-btn');
    const toast = document.getElementById('toast');
    let toastTimer;
    emailBtn.addEventListener('click', async () => {
      const email = emailBtn.dataset.email;
      try {
        await navigator.clipboard.writeText(email);
        showToast('Email скопирован: ' + email);
      } catch {
        window.location.href = 'mailto:' + email;
      }
    });
    const maxBtn = document.getElementById('max-btn');
    maxBtn.addEventListener('click', async () => {
      const phone = maxBtn.dataset.phone;
      try {
        await navigator.clipboard.writeText(phone);
        showToast('Номер MAX скопирован: ' + phone);
      } catch {
        window.location.href = 'tel:' + phone;
      }
    });
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
