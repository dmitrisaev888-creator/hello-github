<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; display: flex; align-items: center; padding: 76px 86px; color: #f1f5ef; background: #101312; font-family: Arial, sans-serif; }
    body::before { content: ""; position: absolute; width: 540px; height: 540px; right: -110px; top: -160px; border-radius: 50%; background: rgba(183,243,74,.12); }
    .copy { position: relative; z-index: 1; width: 870px; }
    .label { color: #b7f34a; font-size: 22px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }
    h1 { max-width: 920px; margin: 28px 0 24px; font-size: 72px; line-height: .98; letter-spacing: -4px; }
    p { max-width: 850px; margin: 0; color: #a7b0a9; font-size: 29px; line-height: 1.35; }
    .mark { position: absolute; right: 82px; bottom: 72px; width: 106px; height: 106px; display: grid; place-items: center; border-radius: 30px; color: #101312; background: #b7f34a; font-size: 33px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="label">Дмитрий Исаев · AI-Isaev</div>
    <h1>Автоматизация данных и процессов</h1>
    <p>Парсеры, боты, рабочие панели и ИИ-конвейеры для малого бизнеса</p>
  </div>
  <div class="mark">AI</div>
</body>
</html>
