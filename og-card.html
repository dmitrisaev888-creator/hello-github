<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    @font-face{font-family:Manrope;src:url("assets/manrope-cyrillic.woff2") format("woff2");font-weight:400 800}
    @font-face{font-family:Manrope;src:url("assets/manrope-latin.woff2") format("woff2");font-weight:400 800}
    *{box-sizing:border-box}
    html,body{width:1200px;height:630px;margin:0;overflow:hidden}
    body{position:relative;display:flex;align-items:center;padding:74px 86px;background:#f6f4ef;color:#1d2926;font-family:Manrope,Arial,sans-serif}
    body::before{position:absolute;right:-130px;top:-180px;width:670px;height:670px;border-radius:50%;background:#e5ede5;content:""}
    body::after{position:absolute;bottom:0;left:0;width:100%;height:12px;background:#1f4d3f;content:""}
    .copy{position:relative;z-index:1;width:850px}
    .label{display:flex;align-items:center;gap:12px;color:#1f4d3f;font-size:19px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    .label::before{width:31px;height:2px;background:#b75d40;content:""}
    h1{max-width:820px;margin:31px 0 19px;font-size:68px;line-height:1.03;letter-spacing:-3.4px}
    p{max-width:740px;margin:0;color:#606b66;font-size:27px;line-height:1.42}
    .photo{position:absolute;right:96px;bottom:64px;width:232px;height:290px;overflow:hidden;border:9px solid #fffefa}
    .photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
    .initials{position:absolute;right:354px;bottom:71px;display:grid;width:74px;height:74px;place-items:center;border-radius:50%;background:#1f4d3f;color:#f6f4ef;font-size:22px;font-weight:800}
  </style>
</head>
<body>
  <div class="copy"><div class="label">Дмитрий Исаев · автоматизация</div><h1>Убираю ручную работу из процессов бизнеса</h1><p>Каталоги, боты, CRM и внутренние инструменты — от задачи до рабочего решения.</p></div>
  <div class="photo"><img src="avatar-hd.jpg" alt=""></div>
  <div class="initials">ДИ</div>
</body>
</html>
